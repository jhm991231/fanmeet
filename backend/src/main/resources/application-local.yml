spring:
  datasource:
    url: jdbc:mysql://localhost:3307/fanmeet
    username: root
    password: localdev
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false # API 서버는 응답 직렬화까지 DB 커넥션을 붙잡을 이유가 없다
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.security.web.DefaultSecurityFilterChain: debug # 부팅 시 필터 체인 순서 출력

jwt:
  secret: ${JWT_SECRET:fanmeet-local-only-secret-key-32-bytes!!} # 로컬 개발용 기본값, 배포 환경에선 반드시 환경변수로
  access-validity-seconds: 1800      # 30분
  refresh-validity-seconds: 1209600  # 14일

app:
  front-url: http://localhost:5173 # 로그인 성공 후 돌려보낼 프론트 주소

