spring:
  application:
    name: fanmeet
  profiles:
    default: local
  config:
    import: optional:classpath:application-secret.yml
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: Kakao
            client-authentication-method: client_secret_post # 카카오는 시크릿을 POST 본문으로 요구
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope: profile_nickname
          google:
            client-name: Google
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            # 기본 scope는 "openid, profile, email" 인데, openid가 있으면 스프링이 OIDC로
            # 처리해 OidcUserService를 쓴다. 그러면 우리가 등록한 CustomOAuth2UserService가
            # 호출되지 않아 DB 저장이 통째로 건너뛰어진다. openid를 빼서 카카오와 같은 경로를 타게 한다.
            scope: profile, email
          naver:
            client-name: Naver
#            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            # scope를 적지 않는다. 네이버는 제공받을 항목을 개발자 콘솔의
            # "제공 정보 선택"에서 정하고, 인가 요청의 scope 파라미터는 쓰지 않는다.
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
