services:
  mysql:
    image: mysql:8.4
    container_name: fanmeet-mysql
    environment:
      MYSQL_ROOT_PASSWORD: localdev
      MYSQL_DATABASE: fanmeet
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocaldev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
